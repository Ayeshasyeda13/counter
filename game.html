<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
</head>
<style>
  body {
    background: rgb(19, 245, 196);
    color: #130202;
    font-family: Arial, Helvetica, sans-serif;
  }

  .title {

    font-weight: bold;
    font-size: 35px;
  }

  .move-icon {
    height: 50px;
  }

  .move-button {
    width: 120px;
    height: 120px;
    border-radius: 60px;
    background-color:rgb(255, 0, 128);
    border: 5px solid rgb(255, 255, 94);
    cursor: pointer;
    margin-right: 20px;
  }
  .result {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 28px;
  }
  .score {
    margin-top: 60px;
  }
  .reset-score-btn {
    padding: 8px 15px ;
    font-size: 15px;
    border:none;
    cursor: pointer;
  }
</style>

<body>
  <p class="title">Rock Paper Scissors</p>
  <button onclick="
      playGame('rock');
    " class="move-button">
    <img class="move-icon" src="rock-emoji.png" alt=""></button>

  <button onclick="
      playGame('paper');
      " class="move-button">
    <img src="paper-emoji.png" alt="" class="move-icon"></button>

  <button onclick="
      playGame('scissors');
      " class="move-button">
    <img src="scissors-emoji.png" alt="" class="move-icon"></button>

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score" ></p>

  <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
       updateScoreElement();
      
    " class="reset-score-btn">Reset Score</button>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };


    updateScoreElement();

    /*
    if (!score) {
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      };
    }
    */

    function playGame(playerMove) {
      const computerMove = pickComputerMove();

      let result = '';

      if (playerMove === 'scissors') {
        if (computerMove === 'rock') {
          result = 'You lose.';
        } else if (computerMove === 'paper') {
          result = 'You win.';
        } else if (computerMove === 'scissors') {
          result = 'Tie.';
        }

      } else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          result = 'You win.';
        } else if (computerMove === 'paper') {
          result = 'Tie.';
        } else if (computerMove === 'scissors') {
          result = 'You lose.';
        }

      } else if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'Tie.';
        } else if (computerMove === 'paper') {
          result = 'You lose.';
        } else if (computerMove === 'scissors') {
          result = 'You win.';
        }
      }

      if (result === 'You win.') {
        score.wins += 1;
      } else if (result === 'You lose.') {
        score.losses += 1;
      } else if (result === 'Tie.') {
        score.ties += 1;
      }

      localStorage.setItem('score', JSON.stringify(score));
      updateScoreElement();



      document.querySelector('.js-result')
        .innerHTML = result;
      document.querySelector('.js-moves')
        .innerHTML = `YOU 
    <img src="${playerMove}-emoji.png" alt="" class="move-icon">
    <img src="${computerMove}-emoji.png" alt="" class="move-icon">
    COMPUTER`;

    }






    function updateScoreElement() {
      document.querySelector('.js-score')
        .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;

    }




    function pickComputerMove() {
      const randomNumber = Math.random();

      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissors';
      }

      return computerMove;
    }
  </script>
</body>

</html>
