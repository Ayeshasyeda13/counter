        function headTailGame(buttonPressed) {

        function handleCostEvent(event) {

            if (event.key === 'Enter') {
                calculateTotal();

            }
        }

        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10;

            }

            document.querySelector('.js-total-cost')
                .innerHTML = ` $${cost} `;
        }



        function subscribe() {

            const buttonElement = document.querySelector('.js-subscribe-button');

            if (buttonElement.innerText === 'subscribe') {
                buttonElement.innerHTML = 'subscribed';
                buttonElement.classList.add('is-subscribed');
            } else {
                buttonElement.innerHTML = 'subscribe';
                buttonElement.classList.remove('is-subscribed');
            }
        }

        // todo list javascript 

        const todoList = [{
            name: 'make dinner',
            dueDate: 2026 - 1 - 1
        }, {
            name: 'take out garbage',
            dueDate: 2026 - 1 - 1
        }];
        rendorTODOlist();

     function handleTODOevent(event){
        if(event.key === 'Enter'){
            addList();
        }
        

     }
        function rendorTODOlist() {
            let todoListHTML = '';
            for (let i = 0; i < todoList.length; i++) {
                const todoObject = todoList[i];
                /*const name = todoObject.name ;
                const dueDate = todoObject.dueDate;*/ //destructing 
                const { name, dueDate } = todoObject;
                const html = `
                    <div>${name}</div>
                    <div>${dueDate}</div>
                    <button onclick="
                    todoList.splice(${i},1);
                    rendorTODOlist();
                    " 
                    class="dlt-todo-btn">Delete</button>`;

                todoListHTML += html;

            }


            document.querySelector('.js-todo-list')
                .innerHTML = todoListHTML;
        }

        function addList() {

            const inputElement = document.querySelector('.js-todoList');
            const name = inputElement.value;

            const dateInputElement = document.querySelector('.js-due-Date-input');

            const dueDate = dateInputElement.value;

            todoList.push({ name, dueDate });

            console.log(todoList);

            inputElement.value = '';

            rendorTODOlist();
        }
